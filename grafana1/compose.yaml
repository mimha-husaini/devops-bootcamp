services:
  prometheus:
    image: prom/prometheus
    ports: 
      - "9090:9090"
    volumes: 
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    #  - prometheus_data:/prometheus- # sasarkan
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports: 
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes: 
  grafana-data: